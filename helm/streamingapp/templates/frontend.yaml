apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamingapp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamingapp-frontend
  template:
    metadata:
      labels:
        app: streamingapp-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/{{ .Values.services.frontend.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: streamingapp-frontend
spec:
  type: LoadBalancer
  selector:
    app: streamingapp-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
