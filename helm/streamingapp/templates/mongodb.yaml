apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: streamingapp-mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-ebs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamingapp-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamingapp-mongodb
  template:
    metadata:
      labels:
        app: streamingapp-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: streamingapp
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: streamingapp-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: streamingapp-mongodb
spec:
  type: ClusterIP
  selector:
    app: streamingapp-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
